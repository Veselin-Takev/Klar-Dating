stages: [verify, e2e, release]

variables:
  NODE_VERSION: '22.23.3'
  NPM_CONFIG_ENGINE_STRICT: 'true'

verify:
  image: node:22.23.3-bookworm-slim
  stage: verify
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openjdk-21-jre-headless
    - npm install --global bun@1.4.4
    - bun --version
    - node scripts/check-toolchain-policy.mjs
    - node scripts/check-dependency-locks.mjs
    - bun ci
    - npm ci --prefix functions --ignore-scripts --no-audit --no-fund
  script:
    - bun run check:enterprise
    - bun audit --audit-level=high
    - bun run typecheck
    - bun run check:kontrast
    - bun run check:hooks
    - bun run check:ki
    - bun run check:sw
    - bun run check:csp
    - bun run check:routen
    - bun run check:guardrails
    - bun run test:enterprise
    - bun run test:pure
    - bun run test
    - bun run test:rules
    - bun run build
    - test -f dist/index.html
    - test -f dist/server.cjs
  artifacts:
    when: always
    paths: [dist/]

e2e:
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  stage: e2e
  needs: [verify]
  before_script:
    - npm install --global bun@1.4.4
    - bun --version
    - bun ci
  script:
    - bunx playwright test

release:
  image: alpine:3.22
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - mkdir -p release
    - git archive --format=tar.gz --output release/klar-${CI_COMMIT_TAG}.tar.gz HEAD
    - sha256sum release/klar-${CI_COMMIT_TAG}.tar.gz > release/SHA256SUMS
  artifacts:
    paths: [release/]
