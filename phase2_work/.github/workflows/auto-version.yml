name: Prepare version update
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Proposed semantic version, for example 0.2.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          check-latest: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Prepare version proposal
        env:
          NEXT_VERSION: ${{ inputs.version }}
        run: |
          [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.env.NEXT_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          git diff -- package.json > version-update.patch
          test -s version-update.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: version-proposal
          path: version-update.patch
          if-no-files-found: error
          retention-days: 14
