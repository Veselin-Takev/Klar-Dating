name: Stochastic LLM Security Evaluation

on:
  workflow_dispatch:
    inputs:
      evaluation_set:
        description: 'Explicit evaluation fixture set; never production data'
        required: true
        default: 'security-baseline'
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ${{ vars.KLAR_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: llm-evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          check-latest: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun ci
      - name: Run opt-in stochastic evaluation only
        env:
          KLAR_RUN_LLM_EVAL: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_EVAL_API_KEY }}
          GEMINI_EVAL_MODEL: ${{ vars.GEMINI_EVAL_MODEL }}
          KLAR_LLM_EVAL_SET: ${{ inputs.evaluation_set }}
        run: bun run eval:llm-security
