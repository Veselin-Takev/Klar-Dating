name: Production Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    environment: production
    # Keep production release routing separate from PR CI to preserve the trust boundary.
    runs-on: ${{ vars.KLAR_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          check-latest: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Production release approval gate
        env:
          KLAR_PRODUCTION_RELEASE_APPROVED: ${{ vars.KLAR_PRODUCTION_RELEASE_APPROVED }}
        run: node scripts/check-production-release-approval.mjs

      - name: Dependency-Lock-Gate
        run: node scripts/check-dependency-locks.mjs

      - name: Release artifact hygiene
        run: node scripts/check-release-artifact-hygiene.mjs

      - name: Install locked dependencies
        run: |
          bun ci
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Security and type gates
        run: |
          bun run check:enterprise
          bun run check:release-workflow
          bun run check:functions
          bun audit --audit-level=high
          bun audit --omit=dev --audit-level=high
          npm audit --prefix functions --omit=dev --audit-level=high
          bun run typecheck

      - name: Test with API and Firebase emulators
        run: |
          bun run test:ci

      - name: Install Chromium for browser acceptance
        run: bunx playwright install --with-deps chromium

      - name: Browser acceptance tests
        run: bunx playwright test

      - name: Production build
        run: bun run build

      - name: Built production server acceptance
        run: bun run test:production

      - name: Prepare release metadata and SBOM
        run: |
          mkdir -p release
          git archive --format=tar.gz --output release/klar-${GITHUB_REF_NAME}.tar.gz HEAD
          bunx --bun @cdxgen/cdxgen@13.3.0 -t bun --spec-version 1.7 -o release/sbom.cdx.json
          cp dist/bundle-report.json release/bundle-report.json
          sha256sum release/klar-${GITHUB_REF_NAME}.tar.gz release/sbom.cdx.json release/bundle-report.json > release/SHA256SUMS
          node scripts/write-release-input-identity.mjs
          sha256sum release/release-input-identity.json >> release/SHA256SUMS

      - name: Bind Firebase Functions build to release identity
        run: node scripts/write-functions-release-identity.mjs

      - name: Container-Build-Vertrag prüfen
        run: bun run check:container-build

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish immutable container
        id: container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/klar-app:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Verify image and generate production manifests
        env:
          KLAR_RELEASE_DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/klar-app@${KLAR_RELEASE_DIGEST}"
          node scripts/release-manifests.mjs render "$image" release/deploy
          docker buildx imagetools inspect "$image" > release/container-inspect.txt
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/klar-app:${GITHUB_REF_NAME}" > release/container-tag-inspect.txt
          KLAR_CONTAINER_TAG_INSPECT=release/container-tag-inspect.txt node scripts/write-container-tag-binding.mjs
          docker buildx imagetools inspect --raw "$image" > release/container-index.json
          node scripts/check-container-attestations.mjs release/container-index.json
          printf '%s\n' "$image" > release/container-digest.txt
          node scripts/write-release-identity.mjs
          KLAR_SBOM_PATH=release/sbom.cdx.json node scripts/write-sbom-identity.mjs
          sha256sum release/container-digest.txt release/container-inspect.txt release/container-tag-inspect.txt release/container-index.json release/deploy/*.json release/build-identity.json release/functions-build-identity.json release/container-tag-binding.json release/sbom-build-identity.json release/release-input-identity.json >> release/SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: klar-production-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            release/*
            release/deploy/*.json
