name: Documentation
on:
  pull_request:
    paths: ['src/**', 'types/**', 'docs/**', '*.md', 'typedoc.json', 'package*.json', 'bun.lock', '.github/workflows/docs-autoupdate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    # Documentation generation may run on the dedicated CI runner as well.
    runs-on: ${{ vars.KLAR_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          check-latest: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun ci
      - run: bun run docs:generate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-documentation
          path: docs/api/
          if-no-files-found: error
          retention-days: 14
