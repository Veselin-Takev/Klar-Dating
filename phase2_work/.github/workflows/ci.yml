name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  # Run the enterprise gate for every pull request, including stacked PRs.
  # Restricting this to main leaves intermediate integration branches unverified.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    # Set KLAR_CI_RUNNER to a dedicated self-hosted label (for example klar-ci) to avoid hosted-minute usage.
    runs-on: ${{ vars.KLAR_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          check-latest: false

      - name: Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Java für Firebase Emulatoren installieren
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Dependency-Lock-Gate
        run: node scripts/check-dependency-locks.mjs

      - name: Abhängigkeiten installieren
        run: |
          bun ci
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Vollständigen Dependency-Befund sichern
        run: |
          mkdir -p security-evidence
          bun audit --json > security-evidence/bun-audit.json || test -s security-evidence/bun-audit.json

      - name: Dependency-Befund hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit
          path: security-evidence/bun-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Statische Sicherheitsprüfungen
        run: |
          bun run check:enterprise
          bun run check:release-workflow
          bun run check:functions
          bun audit --audit-level=high
          bun audit --omit=dev --audit-level=high
          npm audit --prefix functions --omit=dev --audit-level=high

      - name: Harte Guardrail-, Kontrast- und Beschriftungs-Blocker
        run: |
          node scripts/check-guardrails.mjs
          node scripts/check-kontrast.mjs
          node scripts/check-beschriftung.mjs src 0

      - name: TypeScript prüfen
        run: bun run typecheck

      - name: Tests mit API und Firebase Emulatoren ausführen
        run: |
          bun run test:ci

      - name: Produktions-Build erstellen
        run: bun run build

      - name: Gebauten Server mit Produktionsrouting prüfen
        run: bun run test:production

      - name: Bundle-Budget-Nachweis sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-budget
          path: dist/bundle-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Container-Build-Vertrag prüfen
        run: bun run check:container-build

      - name: Produktions-Container bauen
        run: docker build --pull -t klar-app:ci .
