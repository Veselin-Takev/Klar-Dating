version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /phase2_work
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /phase2_work/functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      functions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /phase2_work
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      container-dependencies:
        patterns:
          - "*"
