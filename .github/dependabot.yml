version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /phase2_work
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /phase2_work/functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      functions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /phase2_work
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The production Node runtime is intentionally pinned to 22.23.3 across Docker,
    # GitHub Actions, and the exact-image policy gate. Changes require a separate
    # toolchain migration and compatibility review; don't bundle them with Bun.
    ignore:
      - dependency-name: "node"
    groups:
      container-dependencies:
        patterns:
          - "*"
