name: Enterprise Compliance & Security Audit Gate

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enterprise-compliance-audit:
    name: Enterprise Compliance & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: phase2_work
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"

      - name: Install dependencies (frozen lockfile)
        id: install_dependencies
        run: bun install --frozen-lockfile

      - name: Quality - TypeScript
        id: quality
        run: bun run typecheck

      - name: Unit Tests
        id: unit_tests
        run: bun run test:pure

      - name: Compliance & Security Checks
        id: compliance
        run: |
          bun run check:enterprise
          bun run check:secrets
          bun run check:auth-boundary
          bun run scripts/check-public-firestore-rules.mjs
          bun run scripts/check-ai-pii-sanitizer.mjs
          bun run scripts/check-art17-deletion-audit.mjs 0

      - name: Gitleaks full-range regression test (>30 commits)
        working-directory: .
        run: node --test phase2_work/scripts/gitleaks-pr-range.test.mjs

      - name: Prepare complete Gitleaks commit range
        id: gitleaks_range
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_AFTER_SHA: ${{ github.event.after || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: node phase2_work/scripts/prepare-gitleaks-range.mjs

      - name: Install pinned Gitleaks CLI
        working-directory: .
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -euo pipefail
          archive="gitleaks_"$GITLEAKS_VERSION"_linux_x64.tar.gz"
          checksums="gitleaks_"$GITLEAKS_VERSION"_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v"$GITLEAKS_VERSION
          install_root="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_root" "$RUNNER_TEMP/bin"

          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$release_url/$archive" -o "$install_root/$archive"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$release_url/$checksums" -o "$install_root/$checksums"

          (
            cd "$install_root"
            awk -v asset="$archive" '$2 == asset { print $1 "  " $2; count++ } END { if (count != 1) exit 1 }' \
              "$checksums" > gitleaks-checksum.txt
            sha256sum --check --strict gitleaks-checksum.txt
          )

          tar -xzf "$install_root/$archive" -C "$install_root"
          install -m 0755 "$install_root/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Gitleaks
        id: gitleaks
        working-directory: .
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.gitleaks_range.outputs.log_opts }}
          GITLEAKS_COMMIT_COUNT: ${{ steps.gitleaks_range.outputs.commit_count }}
        run: |
          set -euo pipefail
          test -n "$GITLEAKS_LOG_OPTS"
          printf 'Scanning complete Git range (%s commits): %s\n' "$GITLEAKS_COMMIT_COUNT" "$GITLEAKS_LOG_OPTS"
          gitleaks detect \
            --redact \
            -v \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-level=debug \
            --log-opts="$GITLEAKS_LOG_OPTS"

      - name: Upload Gitleaks SARIF artifact
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: gitleaks-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: 5. Dependency Audit — Production Runtime (Hard-Fail High+)
        id: dep_audit
        run: bun audit --prod --audit-level=high

      - name: 5b. Dependency Audit — Full Supply Chain incl. Dev (Advisory)
        id: dep_audit_full
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        continue-on-error: true
        run: |
          if ! bun audit --audit-level=high; then
            echo "::warning title=Full Supply-Chain Audit (Dev-Dependencies)::High/Critical advisory detected in devDependencies. Review logs for upstream patch availability."
            exit 1
          fi

      - name: Production Build
        id: build
        run: bun run build

      - name: Post Truthful Audit Results to PR (Upsert)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          COMPLIANCE_OUTCOME: ${{ steps.compliance.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          OUTCOME_DEP_AUDIT: ${{ steps.dep_audit.outcome }}
          OUTCOME_DEP_AUDIT_FULL: ${{ steps.dep_audit_full.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const marker = '<!-- enterprise-compliance-audit-gate -->';
            const headSha = context.payload.pull_request?.head?.sha || context.sha;

            const checks = [
              ['Quality / TypeScript', process.env.QUALITY_OUTCOME],
              ['Unit tests', process.env.UNIT_TESTS_OUTCOME],
              ['Compliance & security', process.env.COMPLIANCE_OUTCOME],
              ['Gitleaks', process.env.GITLEAKS_OUTCOME],
              ['Production dependency audit (hard-fail High+)', process.env.OUTCOME_DEP_AUDIT],
              ['Full Supply-Chain Audit (incl. Dev)', process.env.OUTCOME_DEP_AUDIT_FULL],
              ['Build', process.env.BUILD_OUTCOME],
            ];

            const hardFailOutcomes = [
              process.env.QUALITY_OUTCOME,
              process.env.UNIT_TESTS_OUTCOME,
              process.env.COMPLIANCE_OUTCOME,
              process.env.GITLEAKS_OUTCOME,
              process.env.OUTCOME_DEP_AUDIT,
              process.env.BUILD_OUTCOME,
            ];
            const overallPass = hardFailOutcomes.every(outcome => outcome === 'success');

            const render = (outcome) => {
              if (outcome === 'success') return '✅ PASS';
              if (outcome === 'failure') return '❌ FAIL';
              if (outcome === 'skipped') return '⏭️ SKIPPED';
              return `⚠️ ${outcome || 'unknown'}`;
            };
            const renderFullAudit = (outcome) => {
              if (outcome === 'failure') return '⚠️ ADVISORY';
              return render(outcome);
            };

            const rows = checks
              .map(([name, outcome]) => {
                const result = name === 'Full Supply-Chain Audit (incl. Dev)'
                  ? renderFullAudit(outcome)
                  : render(outcome);
                return `| ${name} | ${result} |`;
              })
              .join('\n');

            const body = [
              marker,
              '## Enterprise Compliance & Security Audit Gate',
              '',
              `**Audited PR head:** \`${headSha}\``,
              '',
              `**Hard-fail gate (6 required checks):** ${overallPass ? '✅ PASS' : '❌ FAIL'}`,
              '',
              '| Check | Result |',
              '|---|---|',
              rows,
              '',
              '_The hard-fail gate is determined only by TypeScript, unit tests, compliance/security, Gitleaks, production dependency audit, and build. Full Supply-Chain Audit is separately reported as advisory._',
              '_Results reflect the actual GitHub Actions step outcomes for this workflow run; skipped checks are not reported as passes._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
