name: Klar LLM Security Evaluation

on:
  workflow_dispatch:
    inputs:
      run_evaluation:
        description: 'Explicitly opt in to stochastic LLM security evaluation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    if: ${{ inputs.run_evaluation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: phase2_work
    env:
      KLAR_RUN_LLM_EVAL: ${{ inputs.run_evaluation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Restore dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-llm-bun-1.4.2-${{ hashFiles('phase2_work/bun.lock') }}

      - name: Dependency lock preflight
        run: node scripts/check-dependency-locks.mjs

      - name: Install dependencies from frozen lockfile
        run: |
          bun ci
          git diff --exit-code -- package.json bun.lock

      - name: Run opt-in stochastic security evaluation
        run: |
          test "$KLAR_RUN_LLM_EVAL" = "true"
          bun run eval:llm-security
