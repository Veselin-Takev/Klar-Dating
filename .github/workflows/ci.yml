name: Klar Enterprise CI
# v149 autonomous gate runner
# refresh: corrected IPv6 gate
# CI workflow intentionally remains pull_request/push based; see release evidence.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: klar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.KLAR_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phase2_work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.mjs
      - name: Scope regression tests
        run: node --test scripts/ci-scope-check.mjs
      - name: Adoption evidence consistency
        run: |
          node --test scripts/test-adoption-evidence.mjs
          node scripts/check-adoption-evidence.mjs
      - name: Preflight timeout regression
        if: steps.scope.outputs.full == 'true'
        run: node --test scripts/local-preflight-timeout.test.mjs
      - name: Runtime policy preflight
        if: steps.scope.outputs.full == 'true'
        run: |
          node scripts/check-runtime-node-alignment.mjs
          node --test scripts/runtime-node-alignment-check.mjs
      - name: Release policy regression tests
        if: steps.scope.outputs.full == 'true'
        run: node --test scripts/release-ci-check.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.scope.outputs.full == 'true'
        with:
          bun-version: '1.4.4'
      - name: Codespaces bootstrap regression
        if: steps.scope.outputs.full == 'true'
        run: |
          node --test scripts/check-codespaces-bootstrap.test.mjs
          node scripts/check-codespaces-bootstrap.mjs
      - name: Production audit evidence regressions
        if: steps.scope.outputs.full == 'true'
        run: node --test scripts/report-path.test.mjs scripts/production-audit-evidence-check.test.mjs scripts/validate-load-cost-cli.test.mjs scripts/check-compliance-retry-config.test.mjs
      - name: Offline queue index regression
        if: steps.scope.outputs.full == 'true'
        run: node --experimental-strip-types --test scripts/offline-queue-index.test.mjs scripts/legacy-queue-isolation.test.mjs scripts/offline-replay-auth.test.mjs scripts/offline-retry-scheduler.test.mjs scripts/offline-delivery-receipt.test.mjs
      - name: Chat retry idempotency regression
        if: steps.scope.outputs.full == 'true'
        run: node --test scripts/chat-replay-idempotency.test.mjs
      - name: Dependency lock preflight
        if: steps.scope.outputs.full == 'true'
        run: node scripts/check-dependency-locks.mjs
      - name: Restore dependency downloads
        if: steps.scope.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-java-21-${{ hashFiles('phase2_work/bun.lock', 'phase2_work/functions/package-lock.json') }}
      - name: Install dependencies
        if: steps.scope.outputs.full == 'true'
        run: |
          bun ci
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Enterprise static gates
        if: steps.scope.outputs.full == 'true'
        run: |
          bun run check:enterprise
          bun run check:release-workflow
          bun run check:release-provenance
      - name: Typecheck
        if: steps.scope.outputs.full == 'true'
        run: bun run typecheck
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: steps.scope.outputs.full == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Functions build
        if: steps.scope.outputs.full == 'true'
        run: bun run check:functions
      - name: Tests
        if: steps.scope.outputs.full == 'true'
        run: bun run test:ci
      # Dedicated, non-skippable A-15 pagination/lease proof using loopback Firestore.
      - name: Retention Firestore emulator mandatory
        if: steps.scope.outputs.full == 'true'
        run: |
          bun run test:retention-emulator
      - name: Build
        if: steps.scope.outputs.full == 'true'
        run: bun run build
      - name: Production smoke
        if: steps.scope.outputs.full == 'true'
        run: bun run test:production
      - name: Install Playwright Chromium
        if: steps.scope.outputs.full == 'true'
        run: bun run playwright install --with-deps chromium
      - name: Browser acceptance
        if: steps.scope.outputs.full == 'true'
        run: bun run playwright test
      - name: Upload browser failure diagnostics
        if: failure() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase2_work/playwright-report/
            phase2_work/test-results/
          if-no-files-found: ignore
          retention-days: 7
