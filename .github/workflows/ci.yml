name: Klar Enterprise CI
# v149 autonomous gate runner
# refresh: corrected IPv6 gate
# CI workflow intentionally remains pull_request/push based; see release evidence.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: klar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.KLAR_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phase2_work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependency lock preflight
        run: node scripts/check-dependency-locks.mjs
      - name: Install dependencies
        run: |
          bun install --lockfile-only
          bun ci
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Preserve resolved Bun lockfile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-bun-lock
          path: phase2_work/bun.lock
          if-no-files-found: error
          retention-days: 7
      - name: Enterprise static gates
        run: |
          bun run check:enterprise
          bun run check:release-workflow
          bun run check:release-provenance
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test:ci
      - name: Build
        run: bun run build
      - name: Production smoke
        run: bun run test:production
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser acceptance
        run: bunx playwright test
      - name: Upload browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase2_work/playwright-report/
            phase2_work/test-results/
          if-no-files-found: ignore
          retention-days: 7
