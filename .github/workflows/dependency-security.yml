name: Klar Dependency Security Scan
on:
  pull_request:
    paths:
      - '**/bun.lock'
      - '**/package-lock.json'
      - 'phase2_work/scripts/scan-dependencies*'
      - '.github/workflows/dependency-security.yml'
  push:
    branches: [main]
    paths:
      - '**/bun.lock'
      - '**/package-lock.json'
      - 'phase2_work/scripts/scan-dependencies*'
      - '.github/workflows/dependency-security.yml'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phase2_work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Scanner regressions
        run: node --test scripts/scan-dependencies.test.mjs
      - name: Install frozen scanner parser dependencies
        run: bun ci --ignore-scripts
      - name: Scan all committed npm package versions
        run: node scripts/scan-dependencies.mjs
